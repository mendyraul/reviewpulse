[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewpulse"
version = "0.2.0"
description = "Local review findings pipeline and triage dashboard"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9", "build>=1", "playwright>=1.49"]

[project.scripts]
reviewpulse = "src.server:main"

[tool.setuptools]
packages = ["src", "src.templates", "src.static"]

[tool.setuptools.package-data]
src = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff.lint]
select = ["F"]

[tool.setuptools.data-files]
"share/reviewpulse/schema" = ["schema/finding.schema.json"]
